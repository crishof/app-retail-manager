spring:
  application:
    name: retail-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # ============================
  # CHARACTER ENCODING
  # ============================
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jackson:
    default-property-inclusion: non_null
  
  # ============================
  # DISABLE SPRING CLOUD CONFIG (Phase 5, Monolith Activation)
  # ============================
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  # ============================
  # FLYWAY MIGRATION CONFIGURATION
  # Fixed: this block must live under `spring:` (it was at root level and ignored).
  # Single squashed baseline (V1__baseline_schema.sql) is the source of truth.
  # ============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# ============================
# SERVER CONFIGURATION
# ============================
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ============================
# ACTUATOR HARDENING (Day 3, Task 3.1)
# ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    # MVP runs without a RabbitMQ broker (rabbitmq.event-sync.enabled=false).
    # Disable the AMQP health probe so /actuator/health does not try to connect
    # and report DOWN (which would fail the Railway health check).
    # Re-enable when a broker is provisioned and event-sync is turned on.
    rabbit:
      enabled: false
    # Mail is best-effort (verification emails). Its SMTP probe reports DOWN when mail
    # is not configured, which must not mark the whole service as unhealthy for Railway.
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# ============================
# CORS CONFIGURATION (Day 3, Task 3.2)
# ============================
app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:3001,http://localhost:5173}

# ============================
# RABBITMQ EVENT SYNC (Day 2, Task Phase 2)
# ============================
rabbitmq:
  event-sync:
    enabled: false  # Disabled for MVP - event sync replaced with direct service calls