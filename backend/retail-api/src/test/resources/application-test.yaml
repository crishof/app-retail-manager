spring:
  application:
    name: retail-api-test
  jpa:
    hibernate:
      ddl-auto: create-drop  # Recreate schema for each test
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/retail_api_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

# Disable Flyway for tests - use Hibernate DDL instead
flyway:
  enabled: false

# Disable actuator endpoints for tests
management:
  endpoints:
    web:
      exposure:
        include: none

logging:
  level:
    com.zaphirio.retailapi: DEBUG
    org.springframework.test: DEBUG
    org.hibernate.SQL: DEBUG
