spring:
  application:
    name: retail-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "${LOCAL_SPRING_CONFIG_IMPORT:${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8088}}"

# ============================
# ACTUATOR HARDENING (Day 3, Task 3.1)
# ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ============================
# CORS CONFIGURATION (Day 3, Task 3.2)
# ============================
app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:3001}