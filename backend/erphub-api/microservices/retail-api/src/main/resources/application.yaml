spring:
  application:
    name: retail-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # ============================
  # FLYWAY MIGRATION CONFIGURATION (Day 9, Phase 3)
  # ============================
flyway:
  enabled: true
  locations: classpath:db/migration
  baselineOnMigrate: true
  validateOnMigrate: true
  placeholderReplacement: true
  # Allow creation of migration table if it doesn't exist
  placeholderPrefix: "${"
  placeholderSuffix: "}"

# ============================
# ACTUATOR HARDENING (Day 3, Task 3.1)
# ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ============================
# CORS CONFIGURATION (Day 3, Task 3.2)
# ============================
app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:3001,http://localhost:5173}

# ============================
# RABBITMQ EVENT SYNC (Day 2, Task Phase 2)
# ============================
rabbitmq:
  event-sync:
    enabled: false  # Disabled for MVP - event sync replaced with direct service calls