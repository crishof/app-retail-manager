<header class="topbar" [style.left]="sidebarCollapsed ? 'var(--sidebar-collapsed-width)' : 'var(--sidebar-width)'">
  <button class="topbar__toggle" (click)="onToggle()" aria-label="Alternar menú">
    <span class="material-icons">{{ sidebarCollapsed ? 'menu' : 'menu_open' }}</span>
  </button>

  <div class="topbar__context">
    <p class="topbar__eyebrow">{{ currentSection() }}</p>

    <nav class="topbar__breadcrumb" aria-label="Ruta activa">
      @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
        @if (crumb.route && !last) {
          <a class="topbar__breadcrumb-link" [routerLink]="crumb.route">{{ crumb.label }}</a>
        } @else {
          <span class="topbar__breadcrumb-current">{{ crumb.label }}</span>
        }

        @if (!last) {
          <span class="topbar__breadcrumb-separator">/</span>
        }
      }
    </nav>
  </div>

  <div class="topbar__actions">
    <a class="topbar__icon-btn" [routerLink]="['/ayuda']">
      <span class="material-icons">help_outline</span>
      <span class="topbar__icon-label">Ayuda</span>
    </a>

    <a class="topbar__icon-btn topbar__icon-btn--notif" [routerLink]="['/notificaciones']">
      <span class="material-icons">notifications</span>
      <span class="topbar__icon-label">Avisos</span>
      @if (notificationCount > 0) {
        <span class="topbar__badge">{{ notificationCount }}</span>
      }
    </a>
  </div>
</header>
