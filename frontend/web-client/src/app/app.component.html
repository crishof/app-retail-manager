@if (!hideShell()) {
  <app-sidebar></app-sidebar>
}

<div
  [class]="hideShell() ? '' : 'app-shell'"
  [class.app-shell--panel-collapsed]="!hideShell() && shell.panelCollapsed()"
  [class.app-shell--narrow]="!hideShell() && shell.isNarrow()"
>
  @if (!hideShell()) {
    <app-topbar></app-topbar>
  }

  <main [class]="hideShell() ? '' : 'app-shell__content'">
    <router-outlet></router-outlet>
  </main>
</div>
