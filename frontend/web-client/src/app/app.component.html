@if (!hideShell()) {
  <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>
}

<div [class]="hideShell() ? '' : 'app-shell'" [class.app-shell--collapsed]="!hideShell() && sidebarCollapsed">
  @if (!hideShell()) {
    <app-topbar
      [sidebarCollapsed]="sidebarCollapsed"
      (toggleSidebar)="toggleSidebar()"
    ></app-topbar>
  }

  <main [class]="hideShell() ? '' : 'app-shell__content'">
    <router-outlet></router-outlet>
  </main>
</div>
